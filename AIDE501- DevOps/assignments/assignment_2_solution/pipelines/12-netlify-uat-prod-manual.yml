# Part 2, step 4 (branch features/netlify, then merge request into main).
#   * before_script holds the tooling, script holds the deployment.
#   * Deployments run only on the default branch (main) — on the feature branch
#     these two jobs disappear from the pipeline.
#   * UAT deploys automatically; PRODUCTION waits for a human to press "play".
#   * `when: manual` is placed INSIDE the rule, the documented form; the
#     upstream file mixes a job-level `when:` with `rules:`.
stages:
  - build
  - test
  - deploy_uat
  - deploy_prod

variables:
  NETLIFY_SITE_ID: "REPLACE-WITH-YOUR-SITE-ID"
  NETLIFY_SITE_NAME: "REPLACE-WITH-YOUR-SITE-NAME"

build_website:
  image: node:23-slim
  stage: build
  script:
    - node --version
    - npm --version
    - npm ci
    - npm run build
  artifacts:
    paths:
      - build/

test_artifact:
  image: alpine
  stage: test
  script:
    - test -f build/index.html

unit_tests:
  image: node:22-alpine
  stage: test
  script:
    - npm ci
    - npm test
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml

netlify_uat:
  stage: deploy_uat
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
  before_script:
    - npm install -g netlify-cli@27
    - apk add --no-cache curl
  script:
    - netlify --version
    - netlify status
    - netlify deploy --alias uat --dir build --no-build
    - curl -fsS "https://uat--${NETLIFY_SITE_NAME}.netlify.app/" | grep 'GitLab'
    - echo "End of UAT deployment"

netlify_prod:
  stage: deploy_prod
  image: node:22-alpine
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
      when: manual
  before_script:
    - npm install -g netlify-cli@27
    - apk add --no-cache curl
  script:
    - netlify --version
    - netlify status
    - netlify deploy --prod --dir build --no-build
    - curl -fsS "https://${NETLIFY_SITE_NAME}.netlify.app/" | grep 'GitLab'
    - echo "End of production deployment"
